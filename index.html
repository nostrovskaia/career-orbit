<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent Portfolio — Space Edition</title>
	
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn6qQPC90ZXh0Pjwvc3ZnPg==">


  <style>
    :root {
      --bg-deep: #060914;
      --bg-nebula: #0E162B;
      --glass: rgba(16, 24, 48, 0.72);
      --glass-strong: rgba(12, 18, 38, 0.94);
      --border: rgba(148, 197, 255, 0.24);
      --border-bright: rgba(148, 197, 255, 0.55);
      --ink: #F1F5F9;
      --ink-muted: #94A3B8;
      --cyan: #38BDF8;
      --violet: #A78BFA;
      --gold: #FBBF24;
      --rose: #FB7185;
      --emerald: #34D399;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 18% 12%, #19264E 0%, transparent 45%),
                  radial-gradient(circle at 85% 30%, #261742 0%, transparent 48%),
                  radial-gradient(circle at 50% 90%, #0C2B3D 0%, transparent 55%),
                  var(--bg-deep);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
      min-height: 100vh;
      padding: 32px 20px 64px;
      overflow-x: hidden;
      position: relative;
    }

    .cosmos-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: #FFF;
      border-radius: 50%;
      animation: twinkle var(--dur, 4s) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.8); }
      100% { opacity: 0.95; transform: scale(1.2); }
    }

    .meteor {
      position: absolute;
      width: 110px;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255,255,255,0.85), transparent);
      transform: rotate(-35deg);
      opacity: 0;
      animation: shoot 9s linear infinite;
    }

    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      4% { opacity: 1; }
      14% { transform: translate(-420px, 290px) rotate(-35deg); opacity: 0; }
      100% { opacity: 0; }
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      display: inline-block;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(26px, 3.8vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #FFFFFF, #BAE6FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: var(--violet);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .role {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .bio {
      font-size: 14px;
      color: var(--ink-muted);
      max-width: 640px;
      margin-bottom: 18px;
    }

    .contacts-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .contact-link {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.08);
      transition: all 0.2s ease;
    }

    .contact-link:hover {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.22);
      transform: translateY(-1px);
    }

    .header-skills {
      border-left: 1px solid var(--border);
      padding-left: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .meta-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: #CBD5E1;
    }

    .levels-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .level-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .level-card:hover { border-color: var(--border-bright); }

    .level-card.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.14);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.18);
    }

    .level-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .level-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
    }

    .level-desc {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .rules-bar {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 24px;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .rules-bar summary {
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink);
      user-select: none;
    }

    .rules-list {
      margin-top: 10px;
      padding-left: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 6px 20px;
    }

    .grid-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    .grid-stage {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-bright);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      background: #070C1D;
    }

    .panorama-underlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .panorama-underlay svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .advent-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
    }

    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-right: 1px solid rgba(148, 197, 255, 0.18);
      border-bottom: 1px solid rgba(148, 197, 255, 0.18);
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .tile[data-day="31"] {
      grid-column: span 2;
      aspect-ratio: 2 / 1;
    }

    .tile-cover {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.45s ease, transform 0.45s ease;
      z-index: 2;
      background: #0D152C;
    }

    .tile-svg-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      transition: transform 0.4s ease;
    }

    .tile-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tile:not(.locked):hover .tile-svg-wrap {
      transform: scale(1.06);
    }

    .tile-top-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tile-number {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: #FFF;
      background: rgba(6, 9, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .tile-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .tile.locked .tile-status-dot {
      background: var(--ink-muted);
      box-shadow: none;
      opacity: 0.5;
    }

    .tile-tag-pill {
      position: relative;
      z-index: 1;
      align-self: flex-start;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #E2E8F0;
      background: rgba(6, 9, 20, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 999px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile.locked { cursor: not-allowed; }

    .tile.is-open .tile-cover {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .tile-open-window {
      position: absolute;
      inset: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(6, 9, 20, 0.14);
      transition: background 0.2s ease;
      z-index: 1;
    }

    .tile.is-open:hover .tile-open-window {
      background: rgba(6, 9, 20, 0.42);
    }

    .open-badge {
      align-self: flex-start;
      font-family: var(--mono);
      font-size: 10px;
      color: #FFF;
      background: rgba(6, 9, 20, 0.65);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .open-hint {
      align-self: flex-end;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--cyan);
      background: rgba(6, 9, 20, 0.75);
      padding: 2px 7px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .tile.is-open:hover .open-hint { opacity: 1; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 12, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.active { display: flex; }

    .modal-card {
      background: var(--glass-strong);
      border: 1px solid var(--border-bright);
      border-radius: 22px;
      max-width: 600px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75), 0 0 40px rgba(56, 189, 248, 0.15);
      animation: popIn 0.22s ease-out;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes popIn {
      from { transform: translateY(12px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .modal-close:hover {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.2);
    }

    .modal-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .modal-intro {
      font-size: 14px;
      color: var(--ink-muted);
      margin-bottom: 18px;
    }

    .modal-level-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .modal-tab {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-tab.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.18);
      color: #FFF;
    }

    .task-box {
      background: rgba(56, 189, 248, 0.07);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .task-box-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    .task-box-text {
      font-size: 14px;
      color: var(--ink);
      white-space: pre-line;
    }

    .outcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .outcome-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
    }

    .outcome-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
      display: block;
    }

    .modal-link {
      display: inline-block;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      color: #060914;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
    }

    footer {
      margin-top: 36px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .footer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stealth-toggle {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stealth-toggle:hover {
      border-color: var(--cyan);
      color: var(--ink);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--glass-strong);
      border: 1px solid var(--cyan);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 18px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; }
      .header-skills { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 18px; }
      .levels-panel { grid-template-columns: 1fr; }
      .advent-grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 560px) {
      .advent-grid { grid-template-columns: repeat(2, 1fr); }
      .outcome-grid { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <div class="cosmos-bg" id="cosmos-bg"></div>

    <header>
      <div>
        <span class="badge" id="ui-badge"></span>
        <h1 id="ui-name"></h1>
        <div class="subtitle" id="ui-subtitle"></div>
        <div class="role" id="ui-role"></div>
        <p class="bio" id="ui-bio"></p>
        <div class="contacts-list" id="ui-contacts"></div>
      </div>
      <div class="header-skills">
        <div>
          <div class="meta-label">Ключевые компетенции</div>
          <div class="skills-list" id="ui-skills"></div>
        </div>
      </div>
    </header>

    <section class="levels-panel" id="levels-panel"></section>

    <details class="rules-bar" id="rules-bar">
      <summary>Правила космической экспедиции (нажмите, чтобы развернуть)</summary>
      <ul class="rules-list" id="rules-list"></ul>
    </details>

    <div class="grid-toolbar">
      <span id="ui-progress"></span>
      <span id="ui-hint"></span>
    </div>

    <div class="grid-stage">
      <div class="panorama-underlay" aria-hidden="true">
        <svg viewBox="0 0 1200 1000" preserveAspectRatio="none">
          <defs>
            <radialGradient id="nebula1" cx="25%" cy="30%" r="55%">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#070C1D" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="nebula2" cx="78%" cy="68%" r="50%">
              <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#070C1D" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="1200" height="1000" fill="#070C1D"/>
          <rect width="1200" height="1000" fill="url(#nebula1)"/>
          <rect width="1200" height="1000" fill="url(#nebula2)"/>
          <circle cx="600" cy="500" r="240" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 10"/>
          <circle cx="600" cy="500" r="380" fill="none" stroke="#A78BFA" stroke-opacity="0.14" stroke-width="1.5"/>
          <ellipse cx="600" cy="500" rx="520" ry="160" transform="rotate(-18 600 500)" fill="none" stroke="#FBBF24" stroke-opacity="0.22" stroke-width="2"/>
          <circle cx="600" cy="500" r="72" fill="#FBBF24" fill-opacity="0.18"/>
          <circle cx="600" cy="500" r="36" fill="#38BDF8" fill-opacity="0.35"/>
        </svg>
      </div>
      <div class="advent-grid" id="advent-grid"></div>
    </div>

    <footer>
      <div id="ui-footer-note"></div>
      <div class="footer-controls">
        <button type="button" class="stealth-toggle" id="energy-toggle-btn"></button>
        <button type="button" class="stealth-toggle" id="mode-toggle-btn"></button>
        <button type="button" class="stealth-toggle" id="reset-progress-btn">Сбросить прогресс</button>
      </div>
    </footer>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span class="modal-meta" id="modal-meta"></span>
        <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-intro" id="modal-intro"></p>
      <div class="modal-level-tabs" id="modal-level-tabs"></div>
      <div class="task-box">
        <div class="task-box-title" id="modal-task-title"></div>
        <div class="task-box-text" id="modal-task-text"></div>
      </div>
      <div class="outcome-grid" id="modal-outcomes">
        <div class="outcome-item" id="outcome-result-box">
          <span class="outcome-label">Ожидаемый результат</span>
          <div id="modal-result"></div>
        </div>
        <div class="outcome-item" id="outcome-reward-box">
          <span class="outcome-label">Поддержка дня</span>
          <div id="modal-reward"></div>
        </div>
      </div>
      <a class="modal-link" id="modal-link" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script src="content.js"></script>
  <script>
  (function() {
    const FALLBACK_DATA = {
      settings: {
        badge: 'SPACE EXPEDITION // ADVENT',
        subtitle: 'Интерактивный календарь-портфолио',
        unlockAllByDefault: true,
        rules: [
          'Выбирайте уровень энергии под ваше текущее состояние.',
          'Открывайте ячейки в удобном темпе — без стресса и гонки.',
          'Если внешний файл content.js лежит в той же папке, подгрузятся ваши данные.'
        ]
      },
      profile: {
        name: 'Advent Portfolio',
        role: 'Space Edition // Демо-режим',
        bio: 'Шаблон успешно восстановлен! Чтобы загрузить свой контент, положите файл content.js в ту же папку, где находится index.html.',
        skills: ['HTML5', 'CSS3', 'JavaScript', 'SVG', 'UI/UX'],
        contacts: [
          { label: 'Telegram', url: '#contacts' },
          { label: 'Portfolio', url: '#grid' }
        ],
        footerNote: 'Space Edition'
      },
      days: Array.from({ length: 31 }, (_, i) => {
        const d = i + 1;
        return {
          day: d,
          tag: d === 31 ? 'Финал' : `День ${d}`,
          title: `Миссия дня #${String(d).padStart(2, '0')}`,
          text: 'Подключите ваш файл content.js рядом с index.html, чтобы отобразить реальные задания и кейсы этого дня.',
          minimum: { title: 'Лёгкий старт', task: 'Просто открыть карточку и сделать глубокий вдох.' },
          normal: { title: 'Рабочий ритм', task: 'Выполнить один небольшой шаг по проекту за 15 минут.' },
          maximum: { title: 'Полный форсаж', task: 'Погрузиться в задачу с максимальной отдачей.' },
          result: 'Продвижение на один шаг вперёд.',
          reward: 'Маленькая победа в копилку дня.'
        };
      })
    };

    const DATA = (typeof ADVENT_DATA !== 'undefined' && ADVENT_DATA.days) ? ADVENT_DATA : FALLBACK_DATA;

    const settings = DATA.settings || {};
    const profile = DATA.profile || {};
    const days = Array.isArray(DATA.days) ? DATA.days : [];
    const levels = Array.isArray(settings.levels) && settings.levels.length ? settings.levels : [
      { id: 'minimum', name: 'Я сегодня просто человек', shortName: 'Минимум', description: 'Открыть окошко и выдохнуть.', time: '0 минут', icon: '🌧️' },
      { id: 'normal', name: 'Я в строю', shortName: 'Обычный', description: 'Небольшой шаг с результатом.', time: '15–30 минут', icon: '🌱' },
      { id: 'maximum', name: 'Я могу горы свернуть', shortName: 'Максимум', description: 'Углублённая работа с азартом.', time: '45–90 минут', icon: '🚀' }
    ];
    const rules = Array.isArray(settings.rules) ? settings.rules : [];

    const STORAGE_OPENED_KEY = 'advent_space_opened_v1';
    const STORAGE_MODE_KEY = 'advent_space_unlock_all_v1';
    const STORAGE_ENERGY_KEY = 'advent_space_energy_v1';

    const storage = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
    };

    function sanitizeUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      return /^(https?:\/\/|mailto:|tel:|\/|\.\/|#)/i.test(trimmed) ? trimmed : '';
    }

    (function initCosmos() {
      const bg = document.getElementById('cosmos-bg');
      for (let i = 0; i < 65; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        const size = 1 + (i % 3);
        s.style.width = `${size}px`;
        s.style.height = `${size}px`;
        s.style.left = `${(i * 17.3) % 100}%`;
        s.style.top = `${(i * 29.7) % 100}%`;
        s.style.setProperty('--dur', `${2.5 + (i % 5)}s`);
        s.style.animationDelay = `${-(i * 0.7)}s`;
        bg.appendChild(s);
      }
      for (let m = 0; m < 3; m++) {
        const meteor = document.createElement('span');
        meteor.className = 'meteor';
        meteor.style.top = `${10 + m * 25}%`;
        meteor.style.left = `${65 + m * 12}%`;
        meteor.style.animationDelay = `${m * 3.2}s`;
        bg.appendChild(meteor);
      }
    })();

    const savedMode = storage.get(STORAGE_MODE_KEY);
    let isUnlockAllMode = savedMode !== null ? savedMode === 'true' : Boolean(settings.unlockAllByDefault);
    let currentEnergy = storage.get(STORAGE_ENERGY_KEY) || levels.id;
    if (!levels.some(l => l.id === currentEnergy)) currentEnergy = levels.id;

    let openedDays = [];
    try {
      const parsed = JSON.parse(storage.get(STORAGE_OPENED_KEY) || '[]');
      if (Array.isArray(parsed)) openedDays = parsed;
    } catch (e) { openedDays = []; }

    const safeName = profile.name || 'Космический Адвент';
    document.title = `${safeName} — Advent`;
    document.getElementById('ui-badge').textContent = settings.badge || '';
    document.getElementById('ui-name').textContent = safeName;

    const subtitleEl = document.getElementById('ui-subtitle');
    if (settings.subtitle) {
      subtitleEl.textContent = settings.subtitle;
    } else {
      subtitleEl.style.display = 'none';
    }

    document.getElementById('ui-role').textContent = profile.role || '';
    document.getElementById('ui-bio').textContent = profile.bio || '';
    document.getElementById('ui-footer-note').textContent = [safeName, profile.footerNote].filter(Boolean).join(' · ');

    const skillsContainer = document.getElementById('ui-skills');
    (profile.skills || []).forEach(skill => {
      const span = document.createElement('span');
      span.className = 'skill-tag';
      span.textContent = skill;
      skillsContainer.appendChild(span);
    });

    const contactsContainer = document.getElementById('ui-contacts');
    (profile.contacts || []).forEach(contact => {
      const safeHref = sanitizeUrl(contact.url);
      if (!safeHref) return;
      const a = document.createElement('a');
      a.className = 'contact-link';
      a.href = safeHref;
      if (!safeHref.startsWith('#')) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
      a.textContent = contact.label || safeHref;
      contactsContainer.appendChild(a);
    });

    const levelsPanel = document.getElementById('levels-panel');
    const levelCardMap = {};
    levels.forEach(lvl => {
      const card = document.createElement('div');
      card.className = 'level-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');

      const head = document.createElement('div');
      head.className = 'level-head';

      const title = document.createElement('span');
      title.textContent = `${lvl.icon || ''} ${lvl.name}`.trim();

      const time = document.createElement('span');
      time.className = 'level-time';
      time.textContent = lvl.time || '';

      head.appendChild(title);
      head.appendChild(time);

      const desc = document.createElement('div');
      desc.className = 'level-desc';
      desc.textContent = lvl.description || '';

      card.appendChild(head);
      card.appendChild(desc);

      const selectThisLevel = () => setEnergyMode(lvl.id);
      card.addEventListener('click', selectThisLevel);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectThisLevel(); }
      });

      levelCardMap[lvl.id] = card;
      levelsPanel.appendChild(card);
    });

    const rulesBar = document.getElementById('rules-bar');
    const rulesList = document.getElementById('rules-list');
    if (rules.length) {
      rules.forEach(r => {
        const li = document.createElement('li');
        li.textContent = r;
        rulesList.appendChild(li);
      });
    } else {
      rulesBar.style.display = 'none';
    }

    function setEnergyMode(energyId) {
      currentEnergy = energyId;
      storage.set(STORAGE_ENERGY_KEY, energyId);
      Object.entries(levelCardMap).forEach(([id, el]) => {
        el.classList.toggle('active', id === energyId);
      });
      const activeObj = levels.find(l => l.id === energyId) || levels;
      document.getElementById('energy-toggle-btn').textContent = `Режим: ${activeObj.icon || ''} ${activeObj.name}`.trim();
    }

    function getSpaceCoverSVG(day) {
      const palettes = [
        ['#0F172A', '#38BDF8', '#F472B6', '#FDE047'],
        ['#1E1B4B', '#A78BFA', '#34D399', '#FBBF24'],
        ['#172554', '#60A5FA', '#FB7185', '#F8FAFC'],
        ['#2E1065', '#E879F9', '#22D3EE', '#FDE68A']
      ];
      const [bg, c1, c2, c3] = palettes[day % palettes.length];
      const rot = ((day * 90) % 360);
      const motifs = [
        `<circle cx="50" cy="50" r="22" fill="${c1}"/><ellipse cx="50" cy="50" rx="38" ry="10" transform="rotate(-25 50 50)" fill="none" stroke="${c3}" stroke-width="3"/>`,
        `<circle cx="50" cy="50" r="8" fill="${c3}"/><path d="M50,50 C70,25 85,55 60,75 C35,90 15,60 35,35 C50,15 80,25 85,50" fill="none" stroke="${c1}" stroke-width="3" stroke-linecap="round"/>`,
        `<polygon points="50,10 58,42 90,50 58,58 50,90 42,58 10,50 42,42" fill="${c2}"/><circle cx="50" cy="50" r="10" fill="${c3}"/>`,
        `<path d="M20,80 Q45,55 75,25" stroke="${c1}" stroke-width="8" stroke-linecap="round" opacity="0.5"/><path d="M28,82 Q52,60 75,25" stroke="${c2}" stroke-width="4" stroke-linecap="round"/><circle cx="75" cy="25" r="9" fill="${c3}"/>`,
        `<circle cx="32" cy="50" r="12" fill="none" stroke="${c1}" stroke-width="2.5"/><circle cx="66" cy="50" r="15" fill="${c3}"/><circle cx="72" cy="46" r="13" fill="${bg}"/>`,
        `<polyline points="20,70 40,35 65,45 80,20" fill="none" stroke="${c3}" stroke-width="2"/><circle cx="20" cy="70" r="4" fill="${c1}"/><circle cx="40" cy="35" r="5" fill="${c2}"/><circle cx="65" cy="45" r="4" fill="${c1}"/><circle cx="80" cy="20" r="6" fill="${c3}"/>`,
        `<circle cx="50" cy="50" r="32" fill="none" stroke="${c1}" stroke-width="2" stroke-dasharray="6 5"/><circle cx="50" cy="50" r="18" fill="none" stroke="${c2}" stroke-width="2.5"/><circle cx="50" cy="50" r="7" fill="${c3}"/>`,
        `<circle cx="38" cy="42" r="14" fill="${c1}"/><circle cx="62" cy="58" r="11" fill="${c2}"/><circle cx="62" cy="58" r="4" fill="${c3}"/>`,
        `<polygon points="50,16 64,48 50,42 36,48" fill="${c2}"/><polygon points="50,46 58,72 50,65 42,72" fill="${c3}"/>`,
        `<line x1="50" y1="8" x2="50" y2="92" stroke="${c1}" stroke-width="3"/><ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="${c2}" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="${c3}"/>`,
        `<circle cx="28" cy="30" r="7" fill="${c2}"/><circle cx="72" cy="28" r="9" fill="${c1}"/><circle cx="52" cy="54" r="13" fill="${c3}"/><circle cx="30" cy="74" r="8" fill="${c1}"/><circle cx="74" cy="72" r="6" fill="${c2}"/>`,
        `<path d="M10,65 Q35,25 60,55 T95,35" fill="none" stroke="${c1}" stroke-width="6" stroke-linecap="round"/><path d="M10,78 Q35,38 60,68 T95,48" fill="none" stroke="${c2}" stroke-width="4" stroke-linecap="round"/>`
      ];

      if (day === 31) {
        return `<svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="200" height="100" fill="#131B3A"/>
          <circle cx="60" cy="50" r="28" fill="#38BDF8"/>
          <ellipse cx="60" cy="50" rx="48" ry="12" transform="rotate(-18 60 50)" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
          <polygon points="145,18 153,42 177,50 153,58 145,82 137,58 113,50 137,42" fill="#F472B6"/>
          <circle cx="145" cy="50" r="8" fill="#FDE047"/>
        </svg>`;
      }

      const motif = motifs[(day * 5 + Math.floor(day / 2)) % motifs.length];
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <rect width="100" height="100" fill="${bg}"/>
        <g transform="rotate(${rot} 50 50)">${motif}</g>
      </svg>`;
    }

    function parseStartDate(str) {
      if (!str || typeof str !== 'string') return null;
      const m = str.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      return new Date(Number(m), Number(m) - 1, Number(m));
    }

    const parsedStart = parseStartDate(settings.startDate);
    const targetMonth = Number(settings.targetMonth) || 12;

    function isDayUnlockedByDate(dayNumber) {
      if (isUnlockAllMode) return true;
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (parsedStart) {
        const diffDays = Math.floor((todayMidnight - parsedStart) / 86400000);
        return diffDays >= 0 && dayNumber <= (diffDays + 1);
      }
      return (now.getMonth() + 1) === targetMonth && dayNumber <= now.getDate();
    }

    function getUnlockDateLabel(dayNumber) {
      if (parsedStart) {
        const d = new Date(parsedStart.getFullYear(), parsedStart.getMonth(), parsedStart.getDate() + (dayNumber - 1));
        return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
      }
      return `${String(dayNumber).padStart(2, '0')}.${String(targetMonth).padStart(2, '0')}`;
    }

    let toastTimer = null;
    const toastEl = document.getElementById('toast');
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function updateToolbar() {
      document.getElementById('ui-progress').textContent = `Открыто фрагментов панно: ${openedDays.length} / ${days.length}`;
      document.getElementById('mode-toggle-btn').textContent = isUnlockAllMode
        ? 'Доступ: Открыты все'
        : 'Доступ: По датам';
      document.getElementById('ui-hint').textContent = isUnlockAllMode
        ? 'Все ячейки открыты для свободного просмотра'
        : 'Открывайте по одной ячейке в день, чтобы собрать картину';
    }

    const grid = document.getElementById('advent-grid');
    const tileElements = [];

    function buildGrid() {
      const fragment = document.createDocumentFragment();
      days.forEach(item => {
        const dayNum = Number(item.day);
        const dayLabel = String(dayNum).padStart(2, '0');

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.day = dayNum;
        tile.setAttribute('role', 'button');
        tile.setAttribute('tabindex', '0');

        const cover = document.createElement('div');
        cover.className = 'tile-cover';

        const svgWrap = document.createElement('div');
        svgWrap.className = 'tile-svg-wrap';
        svgWrap.innerHTML = getSpaceCoverSVG(dayNum);
        cover.appendChild(svgWrap);

        const topRow = document.createElement('div');
        topRow.className = 'tile-top-row';

        const numSpan = document.createElement('span');
        numSpan.className = 'tile-number';
        numSpan.textContent = dayLabel;

        const dot = document.createElement('span');
        dot.className = 'tile-status-dot';

        topRow.appendChild(numSpan);
        topRow.appendChild(dot);
        cover.appendChild(topRow);

        if (item.tag) {
          const tagPill = document.createElement('span');
          tagPill.className = 'tile-tag-pill';
          tagPill.textContent = item.tag;
          cover.appendChild(tagPill);
        }

        const openWin = document.createElement('div');
        openWin.className = 'tile-open-window';

        const openBadge = document.createElement('span');
        openBadge.className = 'open-badge';
        openBadge.textContent = `#${dayLabel}`;

        const openHint = document.createElement('span');
        openHint.className = 'open-hint';
        openHint.textContent = 'Открыть →';

        openWin.appendChild(openBadge);
        openWin.appendChild(openHint);

        tile.appendChild(cover);
        tile.appendChild(openWin);

        const handleActivate = () => {
          if (!isDayUnlockedByDate(dayNum)) {
            showToast(`Ячейка #${dayLabel} откроется ${getUnlockDateLabel(dayNum)}. Внизу страницы можно включить режим «Открыты все».`);
            return;
          }
		if (typeof ym === 'function') {
		    ym(window.YM_ID, 'reachGoal', 'open_day', { day: dayNum });
		  }
          if (!openedDays.includes(dayNum)) {
            openedDays.push(dayNum);
            storage.set(STORAGE_OPENED_KEY, JSON.stringify(openedDays));
            tile.classList.add('is-open');
            updateToolbar();
          }
          openModal(item);
        };

        tile.addEventListener('click', handleActivate);
        tile.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleActivate(); }
        });

        tileElements.push({ tile, dayNum });
        fragment.appendChild(tile);
      });

      grid.appendChild(fragment);
      syncTileStates();
    }

    function syncTileStates() {
      tileElements.forEach(({ tile, dayNum }) => {
        tile.classList.toggle('locked', !isDayUnlockedByDate(dayNum));
        tile.classList.toggle('is-open', openedDays.includes(dayNum));
      });
      updateToolbar();
    }

    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalClose = document.getElementById('modal-close');
    let modalEnergyOverride = null;

    function renderModalTask(item, energyId) {
      const levelBlock = item[energyId];
      const taskTitleEl = document.getElementById('modal-task-title');
      const taskTextEl = document.getElementById('modal-task-text');
      if (levelBlock && typeof levelBlock === 'object') {
        taskTitleEl.textContent = levelBlock.title || '';
        taskTextEl.textContent = levelBlock.task || '';
      } else {
        taskTitleEl.textContent = '';
        taskTextEl.textContent = item.text || '';
      }
      document.querySelectorAll('#modal-level-tabs .modal-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === energyId);
      });
    }

    function openModal(item) {
      modalEnergyOverride = currentEnergy;
      const dayLabel = String(item.day).padStart(2, '0');
      document.getElementById('modal-meta').textContent = [`День ${dayLabel}`, item.tag].filter(Boolean).join(' // ');
      document.getElementById('modal-title').textContent = item.title || '';

      const introEl = document.getElementById('modal-intro');
      if (item.text && (item.minimum || item.normal || item.maximum)) {
        introEl.textContent = item.text;
        introEl.style.display = 'block';
      } else {
        introEl.style.display = 'none';
      }

      const tabsContainer = document.getElementById('modal-level-tabs');
      tabsContainer.innerHTML = '';
      const hasLevels = Boolean(item.minimum || item.normal || item.maximum);

      if (hasLevels) {
        tabsContainer.style.display = 'flex';
        levels.forEach(lvl => {
          if (!item[lvl.id]) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'modal-tab';
          btn.dataset.level = lvl.id;
          btn.textContent = `${lvl.icon || ''} ${lvl.shortName || lvl.name}`.trim();
          btn.addEventListener('click', () => {
            modalEnergyOverride = lvl.id;
            renderModalTask(item, lvl.id);
          });
          tabsContainer.appendChild(btn);
        });
      } else {
        tabsContainer.style.display = 'none';
      }

      renderModalTask(item, modalEnergyOverride);

      const outcomesGrid = document.getElementById('modal-outcomes');
      const resBox = document.getElementById('outcome-result-box');
      const rewBox = document.getElementById('outcome-reward-box');
      if (item.result || item.reward) {
        outcomesGrid.style.display = 'grid';
        resBox.style.display = item.result ? 'block' : 'none';
        rewBox.style.display = item.reward ? 'block' : 'none';
        document.getElementById('modal-result').textContent = item.result || '';
        document.getElementById('modal-reward').textContent = item.reward || '';
      } else {
        outcomesGrid.style.display = 'none';
      }

      const linkEl = document.getElementById('modal-link');
      const safeLink = sanitizeUrl(item.linkUrl);
      if (item.linkText && safeLink) {
        linkEl.textContent = item.linkText;
        linkEl.href = safeLink;
        linkEl.style.display = 'inline-block';
      } else {
        linkEl.style.display = 'none';
      }

      modalBackdrop.classList.add('active');
      modalClose.focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove('active');
    }

    modalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('active')) closeModal();
    });

    document.getElementById('energy-toggle-btn').addEventListener('click', () => {
      const idx = levels.findIndex(l => l.id === currentEnergy);
      const next = levels[(idx + 1) % levels.length];
      setEnergyMode(next.id);
      showToast(`Выбран режим: ${next.icon || ''} ${next.name}`);
    });

    document.getElementById('mode-toggle-btn').addEventListener('click', () => {
      isUnlockAllMode = !isUnlockAllMode;
      storage.set(STORAGE_MODE_KEY, String(isUnlockAllMode));
      syncTileStates();
      showToast(isUnlockAllMode ? 'Открыты все ячейки' : 'Включен режим по датам');
    });

    document.getElementById('reset-progress-btn').addEventListener('click', () => {
      openedDays = [];
      storage.remove(STORAGE_OPENED_KEY);
      syncTileStates();
      showToast('Панно снова закрыто космическими обложками');
    });

    setEnergyMode(currentEnergy);
    buildGrid();
  })();
  </script>
</body>
</html>
